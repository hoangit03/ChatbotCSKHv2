  # ── Vector DB (Qdrant) ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC (tuỳ chọn)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Map từ QDRANT_API_KEY trong .env
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      - rag_internal

  # ── Redis (rate limit + cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag_internal
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


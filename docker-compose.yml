services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbotcskhv2-api
    container_name: cskh_api
    env_file: .env
    environment:
    - GUNICORN_WORKERS=2
    - QDRANT_URL=http://core_qdrant:6333
    - REDIS_URL=redis://core_redis:6379/0
    - DATABASE_URL=postgresql+asyncpg://admin:Admin%40123@core_postgres:5432/chat_db
    ports:
    - 8006:8000
    volumes:
    - doc_storage:/app/storage/documents
    restart: unless-stopped
    networks:
    - global_proxy_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

volumes:
  doc_storage:
    driver: local
networks:
  global_proxy_network:
    external: true
